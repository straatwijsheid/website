name: worker tests

on:
  push:
    paths: ['worker/**', '.github/workflows/worker-tests.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test worker/test/
